# Ruff lint configuration for the LNG PORV Sizing Portal
target-version = "py310"
line-length = 160

[lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # line length handled by the formatter
    "E402",  # module level imports not at top (Streamlit page config ordering)
]

[lint.per-file-ignores]
"test_*.py" = ["F401", "E402"]
# run_app.py contains intentional "unused" imports that force PyInstaller to bundle
# the local application modules (removing them breaks the packaged apps). See run_app.py.
"run_app.py" = ["F401", "I001"]
