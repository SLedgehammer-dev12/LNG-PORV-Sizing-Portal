# Ruff lint configuration for the LNG PORV Sizing Portal
target-version = "py310"
line-length = 160

[lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # line length handled by the formatter
    "E402",  # module level imports not at top (Streamlit page config ordering)
]

[lint.per-file-ignores]
"test_*.py" = ["F401", "E402"]
